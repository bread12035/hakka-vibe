[project]
name = "hakka-vibe"
version = "0.1.0"
description = "Agent harness and token cost experiments"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "pandas>=2.0", "python-dotenv>=1.0"]

[project.scripts]
hakka-vibe = "hakka_vibe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "pandas-stubs>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakka_vibe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
# Vendored skills are upstream copies and must stay byte-identical — ruff format
# rewrites Python code blocks inside their markdown.
extend-exclude = [".claude/"]
